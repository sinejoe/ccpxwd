<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive — Charleston City Paper Crossword</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f6f1e6'/%3E%3Cg stroke='%231c1a17' stroke-width='1'%3E%3Crect x='0.5' y='0.5' width='7' height='7' fill='%23e8c266'/%3E%3Crect x='8.5' y='0.5' width='7' height='7' fill='%231c1a17'/%3E%3Crect x='0.5' y='8.5' width='7' height='7' fill='%231c1a17'/%3E%3Crect x='8.5' y='8.5' width='7' height='7' fill='%23f6f1e6'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --paper:#f6f1e6;
    --ink:#1c1a17;
    --rule:#c9beac;
    --accent:#a3312a;
    --cell:#fffdf8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Georgia, 'Times New Roman', serif;
    padding:14px;
  }
  header{
    text-align:center;
    border-bottom:3px double var(--ink);
    padding-bottom:10px;
    margin-bottom:14px;
  }
  header .kicker{
    font-family:'Courier New', monospace;
    letter-spacing:3px;
    font-size:11px;
    text-transform:uppercase;
    color:#594923;
  }
  header h1{
    margin:4px 0 2px;
    font-size:26px;
    letter-spacing:1px;
  }
  .toolbar{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
  }
  .toolbar a{
    font-family:'Courier New', monospace;
    font-size:11.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    background:var(--cell);
    border:1px solid var(--ink);
    color:var(--ink);
    padding:7px 12px;
    text-decoration:none;
    border-radius:2px;
  }
  #list{
    max-width:520px;
    margin:0 auto;
    border-top:1px solid var(--rule);
  }
  #list a{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:12px 4px;
    border-bottom:1px solid var(--rule);
    color:var(--ink);
    text-decoration:none;
  }
  #list a:hover{ background:var(--cell); }
  #list .title{ font-size:15px; }
  #list .date{
    font-family:'Courier New', monospace;
    font-size:11.5px;
    color:#5a5346;
    white-space:nowrap;
    align-self:center;
  }
  #empty{ text-align:center; color:#5a5346; font-style:italic; }
</style>
</head>
<body>

<header>
  <div class="kicker">Charleston City Paper Crossword</div>
  <h1>Archive</h1>
</header>

<div class="toolbar"><a href="/">This week's puzzle</a></div>

<div id="list"></div>
<p id="empty" style="display:none;">No past puzzles yet.</p>

<script>
(async function(){
  const res = await fetch('/puzzles/index.json', {cache:'no-store'});
  const index = await res.json();
  const listEl = document.getElementById('list');
  if(index.length === 0){
    document.getElementById('empty').style.display = 'block';
    return;
  }
  for(const entry of index){
    const a = document.createElement('a');
    a.href = '/archive/' + entry.id;
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = entry.title;
    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = entry.date;
    a.appendChild(title);
    a.appendChild(date);
    listEl.appendChild(a);
  }
})();
</script>

</body>
</html>
